name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  phpstan-analysis:
    name: Análise Estática (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Instalar dependências (Composer)
        run: composer install --prefer-dist --no-progress

      - name: Rodar PHPStan
        run: vendor/bin/phpstan analyse app --level=1 

  docker-build-test:
    name: Teste de Build e Cypress
    needs: phpstan-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir ambiente com Docker Compose
        run: docker compose up -d --build

      - name: Rodar testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          # A porta 3333 bate com o seu docker-compose.yml
          wait-on: 'http://localhost:3333/sacoleVendas'
          config: baseUrl=http://localhost:3333/sacoleVendas